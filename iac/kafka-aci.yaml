apiVersion: 2019-12-01
location: uksouth
name: kafka-container-group
properties:
  containers:
    - name: kafka
      properties:
        image: confluentinc/cp-kafka:latest
        ports:
          - port: 9092
            protocol: TCP
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.0
        environmentVariables:
          - name: CLUSTER_ID
            value: 'YzkwZTdmNTYtNGF1ZC00NW'
          - name: KAFKA_NODE_ID
            value: '1'
          - name: KAFKA_PROCESS_ROLES
            value: 'broker,controller'
          - name: KAFKA_CONTROLLER_LISTENER_NAMES
            value: 'CONTROLLER'
          - name: KAFKA_LISTENERS
            value: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
          - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
            value: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
          - name: KAFKA_ADVERTISED_LISTENERS
            value: 'PLAINTEXT://localhost:29092,PLAINTEXT_HOST://kafka-aci.uksouth.azurecontainer.io:9092'
          - name: KAFKA_CONTROLLER_QUORUM_VOTERS
            value: '1@localhost:29093'
          - name: KAFKA_INTER_BROKER_LISTENER_NAME
            value: 'PLAINTEXT'
          - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
            value: '1'
          - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
            value: '1'
          - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
            value: '1'
          - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
            value: 'true'
  osType: Linux
  ipAddress:
    type: Public
    ports:
      - port: 9092
        protocol: TCP
    dnsNameLabel: kafka-aci
  restartPolicy: Always
tags:
  environment: dev
  app: kafka
type: Microsoft.ContainerInstance/containerGroups